name: Update SEO files

on:
  push:
    branches: [delete]
    paths:
      - 'content/site.json'
      - 'content/projects.json'
      - 'index.html'
      - 'work.html'
      - 'about.html'
      - 'connect.html'
      - 'random.html'
      - 'project.html'
      - 'tools/build_routes.py'
      - 'tools/build_sitemap.py'
  workflow_dispatch:

concurrency:
  group: update-generated-routes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-seo-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: delete

      - name: Generate clean routes
        run: python tools/build_routes.py

      - name: Generate sitemap and robots
        run: python tools/build_sitemap.py

      - name: Commit generated routes and SEO files
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- sitemap.xml robots.txt work about connect random)" ]; then
            echo "No generated route or SEO changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt work about connect random
          git commit -m "build: update clean routes and SEO files"
          git push
