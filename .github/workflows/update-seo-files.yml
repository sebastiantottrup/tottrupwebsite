name: Update SEO files

on:
  push:
    branches: [delete]
    paths:
      - 'content/site.json'
      - 'content/projects.json'
      - 'tools/build_sitemap.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-seo-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: delete

      - name: Generate sitemap and robots
        run: python tools/build_sitemap.py

      - name: Commit generated SEO files
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml robots.txt; then
            echo "No generated SEO changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git commit -m "seo: update sitemap and robots"
          git push
