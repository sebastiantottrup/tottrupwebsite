<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio CMS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#fff; color:#111; font:11px/1.4 monospace; }
    main { width:min(560px, calc(100% - 32px)); }
    h1 { font-size:11px; margin:0 0 20px; }
    p { margin:0 0 14px; color:#777; }
    a { color:#111; text-decoration:underline; text-underline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio CMS</h1>
    <p>This site uses Pages CMS with GitHub. Use it to manage projects, choose the four Home projects, edit About, and maintain Connect links.</p>
    <a href="https://app.pagescms.org/">Open Pages CMS</a>
  </main>
</body>
</html>
