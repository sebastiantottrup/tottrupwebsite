media:
  input: assets/uploads
  output: assets/uploads
  rename: safe

settings:
  hide: true
  content:
    merge: true
  commit:
    templates:
      update: "content: update {path}"
      create: "content: create {path}"
      delete: "content: delete {path}"

content:
  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    operations:
      create: false
      delete: false
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.year} : {fields.title}"
        fields:
          - name: slug
            label: Slug
            type: string
            required: true
            description: "Lowercase URL name, e.g. polymer-workshop. Do not change after publishing unless you want the URL to change."
            pattern:
              regex: "^[a-z0-9-]+$"
              message: "Use lowercase letters, numbers and hyphens only."
          - name: year
            label: Year
            type: number
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: featured
            label: Show on homepage
            type: boolean
            description: "The homepage shows a maximum of four selected projects."
          - name: featuredOrder
            label: Homepage position
            type: number
            description: "Use 1–4. Only the first four featured projects are shown."
          - name: thumbnail
            label: Project thumbnail
            type: image
            required: true
            description: "Used on Home, Work Grid and the 1:1 Work List hover preview."
          - name: thumbnailAlt
            label: Thumbnail alt text
            type: string
            description: "Describe what is visibly shown in the image. Keep it short and specific. Used for accessibility and image SEO."
          - name: format
            label: Format
            type: string
            description: "Shown in the Work list and project headline, e.g. Design + Branding, Product, Images / Video."
          - name: brand
            label: Brand
            type: string
            description: "Shown in the Work list and project headline, e.g. Pas Normal Studios, Polymer Workshop, Personal."
          - name: client
            label: Client
            type: string
            description: "Optional client name if different from the Brand."
          - name: role
            label: Role
            type: string
          - name: description
            label: Project text
            type: text
            description: "Long-form project description shown in the scrollable text panel. Use natural language and include relevant project context rather than keyword stuffing."
          - name: media
            label: Project gallery
            type: block
            list:
              collapsible:
                collapsed: true
                summary: "Media {index}"
            blockKey: type
            blocks:
              - name: image
                label: Image
                fields:
                  - name: src
                    label: Image
                    type: image
                    required: true
                  - name: alt
                    label: Alt text
                    type: string
                    description: "Short description of what is visible in this specific image."
              - name: video
                label: Video
                fields:
                  - name: src
                    label: Video file
                    type: file
                    required: true
                    options:
                      categories: [video]
                  - name: poster
                    label: Video poster image
                    type: image
                  - name: alt
                    label: Label / description
                    type: string
          - name: seoTitle
            label: SEO title
            type: string
            description: "Optional. Aim for roughly 45–60 characters. Leave blank to use Project Title — Sebastian Tottrup."
          - name: seoDescription
            label: SEO description
            type: text
            description: "Optional. Aim for roughly 140–160 characters. Describe the project clearly and naturally. Falls back to Project text."
          - name: seoImage
            label: SEO / social share image
            type: image
            description: "Optional. Prefer a strong landscape image around 1200×630. Falls back to the project thumbnail."

  - name: site
    label: Site / About / Connect
    type: file
    path: content/site.json
    format: json
    operations:
      create: false
      delete: false
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: siteUrl
        label: Live site URL
        type: string
        description: "Full public URL including https:// and no page path. Required for canonical URLs, sitemap and absolute social-share images."
      - name: seoTitle
        label: Homepage SEO title
        type: string
        description: "Recommended length: roughly 45–60 characters."
      - name: seoDescription
        label: Homepage SEO description
        type: text
        description: "Recommended length: roughly 140–160 characters."
      - name: seoImage
        label: Default social share image
        type: image
        description: "Default Open Graph / social image. Prefer a landscape image around 1200×630."
      - name: profileImage
        label: Profile / schema image
        type: image
        description: "Optional image used in Person structured data."
      - name: workSeoTitle
        label: Work page SEO title
        type: string
      - name: workSeoDescription
        label: Work page SEO description
        type: text
        description: "Recommended length: roughly 140–160 characters."
      - name: aboutSeoTitle
        label: About page SEO title
        type: string
      - name: aboutSeoDescription
        label: About page SEO description
        type: text
        description: "Recommended length: roughly 140–160 characters."
      - name: connectSeoTitle
        label: Connect page SEO title
        type: string
      - name: connectSeoDescription
        label: Connect page SEO description
        type: text
        description: "Recommended length: roughly 140–160 characters."
      - name: intro
        label: About intro line
        type: string
      - name: about
        label: Story / background
        type: text
      - name: location
        label: Location
        type: string
      - name: jobTitle
        label: Professional title
        type: string
        description: "Optional. Used in Person structured data, e.g. Creative Director / Designer."
      - name: resume
        label: Experience
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.period} : {fields.role}"
        fields:
          - name: period
            label: Period
            type: string
          - name: role
            label: Role
            type: string
          - name: company
            label: Company
            type: string
      - name: instagram
        label: Instagram handle
        type: string
      - name: strava
        label: Strava URL
        type: string
      - name: stravaLabel
        label: Strava display name
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: linkedinLabel
        label: LinkedIn display name
        type: string
      - name: website
        label: Website URL
        type: string
      - name: websiteLabel
        label: Website display name
        type: string
      - name: copyrightStartYear
        label: Copyright start year
        type: number
        description: "Footer displays Name © start year–current year."
      - name: siteCredit
        label: Hidden site credit
        type: string
        description: "Easter egg revealed when the footer copyright is clicked."
